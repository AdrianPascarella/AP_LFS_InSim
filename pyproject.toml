[build-system]
# setuptools>=77: soporte de licencia SPDX (license = "MIT" + license-files)
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lfs-insim"
# Fuente única de versión: src/lfs_insim/__init__.py (__version__)
dynamic = ["version"]
authors = [
  { name="Adrian Pascarella" },
]
description = "Composable Python framework for the Live for Speed InSim protocol"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
keywords = [
    "lfs", "live-for-speed", "insim", "outsim", "outgauge",
    "racing", "simulator", "telemetry",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Games/Entertainment :: Simulation",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]

[project.urls]
Homepage = "https://github.com/AdrianPascarella/AP_LFS_InSim"
Repository = "https://github.com/AdrianPascarella/AP_LFS_InSim"
Issues = "https://github.com/AdrianPascarella/AP_LFS_InSim/issues"

# CLI - único console-script. Los generadores (antes 'generate-stubs' y
# 'update-all', comandos globales que invadían el PATH ajeno) son ahora
# subcomandos: 'lfs-insim stubs' y 'lfs-insim update-all'.
[project.scripts]
lfs-insim = "lfs_insim.cli:main"

[project.optional-dependencies]
# matplotlib no es del core: lo necesita el InSim ai_control (map_renderer);
# va en dev para que el entorno de desarrollo/tests sea reproducible.
# ruff: lint + format (Fase 4). No es dependencia de runtime.
dev = ["pytest>=7.0", "matplotlib", "ruff>=0.6"]

[tool.setuptools.dynamic]
version = { attr = "lfs_insim.__version__" }

# Detección automática de paquetes en src/
[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
# line-length 88: default del ecosistema (ruff/black); el core ya cabe casi
# entero (98% de las lineas <=88), asi que la pasada de format es minima.
line-length = 88
# Python minimo soportado (coherente con requires-python = ">=3.9").
target-version = "py39"
# Los .pyi son artefactos autogenerados (lfs-insim stubs): no los toca ruff,
# los regenera el generador. .venv/build/dist ya estan en el exclude por defecto.
extend-exclude = ["*.pyi"]

[tool.ruff.lint]
# Arranque conservador (decidido en S16): pycodestyle E/W, pyflakes F, isort I.
# Se ampliara en pasadas posteriores (UP, B, C4, SIM...) como cambios revisables.
select = ["E", "F", "I", "W"]
