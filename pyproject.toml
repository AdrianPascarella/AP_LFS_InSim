[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "lfs-insim"
version = "0.0.0"
description = "A Python library for the Live for Speed InSim protocol (InSim, OutSim, OutGauge)."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Adrian Pascarella" }]
keywords = ["live for speed", "lfs", "insim", "outsim", "outgauge", "racing", "simulator"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Games/Entertainment :: Simulation",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/AdrianPascarella/AP_LFS_InSim"
Issues = "https://github.com/AdrianPascarella/AP_LFS_InSim/issues"

[dependency-groups]
dev = ["ruff", "mypy", "pytest"]

[tool.hatch.build.targets.wheel]
packages = ["src/lfs_insim"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "scripts"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
# Network tests are skipped by default; run them with: pytest -m network
addopts = ["--strict-markers", "-ra", "-m", "not network"]
markers = ["network: needs internet access to lfs.net"]
