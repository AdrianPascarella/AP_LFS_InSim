[build-system]
# setuptools>=77: soporte de licencia SPDX (license = "MIT" + license-files)
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lfs-insim"
# Fuente única de versión: src/lfs_insim/__init__.py (__version__)
dynamic = ["version"]
authors = [
  { name="Adrian Pascarella" },
]
description = "Composable Python framework for the Live for Speed InSim protocol"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
keywords = [
    "lfs", "live-for-speed", "insim", "outsim", "outgauge",
    "racing", "simulator", "telemetry",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Games/Entertainment :: Simulation",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]

[project.urls]
Homepage = "https://github.com/AdrianPascarella/AP_LFS_InSim"
Repository = "https://github.com/AdrianPascarella/AP_LFS_InSim"
Issues = "https://github.com/AdrianPascarella/AP_LFS_InSim/issues"
Changelog = "https://github.com/AdrianPascarella/AP_LFS_InSim/blob/main/CHANGELOG.md"

# CLI - único console-script. Los generadores (antes 'generate-stubs' y
# 'update-all', comandos globales que invadían el PATH ajeno) son ahora
# subcomandos: 'lfs-insim stubs' y 'lfs-insim update-all'.
[project.scripts]
lfs-insim = "lfs_insim.cli:main"

[project.optional-dependencies]
# matplotlib no es del core: lo necesita el InSim ai_control (map_renderer);
# va en dev para que el entorno de desarrollo/tests sea reproducible.
# ruff: lint + format (Fase 4). No es dependencia de runtime. Pin al minor
# 0.15.x igual que el CI: ruff format puede cambiar de estilo entre minors,
# asi que local y CI reformatean identico (subir de minor es deliberado).
dev = ["pytest>=7.0", "matplotlib", "ruff>=0.15,<0.16", "mypy>=1.13"]
# Empaquetado/publicación: ensayo LOCAL en TestPyPI (build + twine check/upload).
# El workflow de publicación (.github/workflows/publish.yml) usa la action de
# PyPA con Trusted Publishing, no estas herramientas; van aquí para el ensayo
# local reproducible: pip install -e ".[publish]". Ver docs/dev/PUBLICACION.md.
publish = ["build", "twine"]

[tool.setuptools.dynamic]
version = { attr = "lfs_insim.__version__" }

# Detección automática de paquetes en src/
[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
# line-length 88: default del ecosistema (ruff/black); el core ya cabe casi
# entero (98% de las lineas <=88), asi que la pasada de format es minima.
line-length = 88
# Python minimo soportado (coherente con requires-python = ">=3.9").
target-version = "py39"
# Los .pyi son artefactos autogenerados (lfs-insim stubs): no los toca ruff,
# los regenera el generador. .venv/build/dist ya estan en el exclude por defecto.
extend-exclude = ["*.pyi"]

[tool.ruff.lint]
# Arranque conservador (decidido en S16): pycodestyle E/W, pyflakes F, isort I.
# Se ampliara en pasadas posteriores (UP, B, C4, SIM...) como cambios revisables.
# FA102: usa union PEP 604 (`X | Y`) sin `from __future__ import annotations` ->
# revienta en runtime en Python 3.9 (soportado). Lo cazo en lint, no en el CI de
# 3.9 (S16: se coló justamente esto). No activo FA100 (solo sugiere estilo).
select = ["E", "F", "FA102", "I", "W"]
# ruff format es el dueno del ancho de linea; con el formatter adoptado, E501
# solo saltaria en strings, comentarios o URLs que no se pueden partir.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Los insims usan star-imports como patron establecido (um_class re-exporta los
# enums del protocolo; test_insim/users_management/prueba_botones los consumen
# con `import *`), imports tras sys.path/mute_send_logs (E402) y nombres de una
# sola letra en codigo pendiente de refactor. Se iran quitando al limpiar cada
# insim (Fase 5-6).
"insims/**" = ["F403", "F405", "E402", "E741"]
# packets/__init__ y packets/maps.py agregan la API publica via star-import
# guiado por __all__ (patron de paquete, con __all__ explicito: no es una fuga).
"src/lfs_insim/packets/__init__.py" = ["F403", "F405"]
"src/lfs_insim/packets/maps.py" = ["F403", "F405"]
# insim_enums define constantes del protocolo LFS con nombres de una sola letra
# (I, O) que reflejan la spec y no se pueden renombrar.
"src/lfs_insim/insim_enums.py" = ["E741"]

[tool.mypy]
# Gradual (Fase 4): mypy vigila el core ya limpio; los modulos con friccion se
# tipan uno a uno quitando su override de abajo. NO bloquea el merge (el job de
# CI corre con continue-on-error).
files = ["src/lfs_insim"]
# mypy 2.x no acepta target 3.9; el runtime en 3.9 lo cubre el job de pytest.
python_version = "3.10"
ignore_missing_imports = true  # matplotlib y libs sin stubs de tipos
# Resolver tipos de imports externos (p.ej. config.settings que carga el CLI)
# sin reportar sus errores: solo se chequea src/lfs_insim.
follow_imports = "silent"
exclude = ['\.pyi$']  # stubs autogenerados (solo para el IDE)
warn_redundant_casts = true
warn_unused_ignores = true

# --- Backlog de tipado gradual: modulos aun sin tipar ---
# packets/*: dataclasses de protocolo con field(metadata=...) que mypy lee como
# 'assignment' incompatible, y star-imports (name-defined). Ruido, no bugs.
[[tool.mypy.overrides]]
module = "lfs_insim.packets.*"
ignore_errors = true
# insim_loader: friccion con importlib (ModuleSpec | None sin None-check) y los
# kwargs que el loader inyecta en InSimApp. Merece una pasada de tipado propia.
[[tool.mypy.overrides]]
module = "lfs_insim.insim_loader"
ignore_errors = true
# decoders/utils: 2 errores puntuales cada uno (metadata_to_dict sobre 'type';
# desempaquetado variadico *args). Se tiparan junto con packets.
[[tool.mypy.overrides]]
module = ["lfs_insim.insim_packet_decoders", "lfs_insim.utils"]
ignore_errors = true
