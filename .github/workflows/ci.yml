name: CI

on:
  push:
    branches: [main, refactor/estabilizacion]
  pull_request:
    branches: [main, refactor/estabilizacion]

# Un push nuevo sobre la misma ref cancela el run anterior en vuelo.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Pin al minor actual: ruff format puede cambiar de estilo entre minors,
      # asi que subir de 0.15.x es un acto deliberado (re-formatear + revisar).
      - name: Install ruff
        run: |
          python -m pip install --upgrade pip
          pip install "ruff==0.15.*"
      - name: ruff check
        run: ruff check
      - name: ruff format --check
        run: ruff format --check

  test:
    name: Tests (py${{ matrix.python-version }} - ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # Min soportado, un intermedio y el reciente estable.
        python-version: ["3.9", "3.11", "3.13"]
        # Paridad con el entorno de desarrollo (Windows).
        include:
          - os: windows-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (editable + dev)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      # Backend no interactivo: ai_control importa matplotlib (map_renderer) y
      # el runner no tiene display.
      - name: Run tests
        env:
          MPLBACKEND: Agg
        run: pytest -q

  typecheck:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    # Gradual (Fase 4): informa el estado de tipos del core pero NO bloquea el
    # merge. Se ira endureciendo modulo a modulo (ver overrides en pyproject).
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install (editable + dev)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: mypy
        run: mypy
