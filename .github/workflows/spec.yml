name: spec

# Fails when lfs.net publishes an InSim specification different from spec/checked.json.
# To update: run scripts/fetch_spec.py locally, review the change, then --accept.
# The schedule only runs from the default branch (main); pushes run it on any branch.

on:
  schedule:
    - cron: "17 6 * * 1"  # Mondays, 06:17 UTC
  push:
    paths:
      - spec/checked.json
      - scripts/fetch_spec.py
      - .github/workflows/spec.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . --group dev
      - name: Compare with lfs.net
        run: python -m pytest -m network --color=no
